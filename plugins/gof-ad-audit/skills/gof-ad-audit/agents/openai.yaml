interface:
  display_name: "无尽冬日素材审核"
  short_description: "送审前查素材会不会被字节、腾讯、星广拒审：先问清渠道和字幕脚本，回复后审视频、字幕、文案、图片、飞书脚本，出带时间码的问题清单和改法"
  default_prompt: "Use $gof-ad-audit to check this material before it is sent for review: ask only what you cannot work out (just the questions), and once I reply run the whole audit and tell me what would be rejected, where, and how to fix it."
policy:
  allow_implicit_invocation: true
